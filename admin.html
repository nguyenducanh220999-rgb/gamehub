<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamHub Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div id="loginPanel" class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-white tracking-widest">GAM<span class="text-blue-500">HUB</span> ADMIN</h1>
            <p class="text-slate-500 text-sm mt-2">Đăng nhập để quản lý trò chơi</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email (VD: admin@gamhub.store)" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:border-blue-500 outline-none">
            <input type="password" id="password" placeholder="Mật khẩu" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm focus:border-blue-500 outline-none">
            <button id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition">ĐĂNG NHẬP</button>
        </div>
    </div>

    <div id="adminPanel" class="hidden w-full max-w-4xl bg-slate-900 p-6 md:p-8 rounded-2xl border border-slate-800 shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-gamepad text-blue-500 mr-2"></i> KHO TRÒ CHƠI</h2>
            <button id="btnLogout" class="text-red-400 hover:text-red-300 text-sm font-semibold"><i class="fa-solid fa-right-from-bracket"></i> Thoát</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase">Mã Game (Viết liền không dấu)</label>
                    <input type="text" id="gId" placeholder="VD: tiemtaphoa" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 mt-1 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase">Tên Game hiển thị</label>
                    <input type="text" id="gName" placeholder="VD: Tiệm Tạp Hóa Bà Xiêm" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 mt-1 outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-400 uppercase">Mô tả ngắn</label>
                    <textarea id="gDesc" rows="2" placeholder="VD: Quản lý và bán đồ ăn vặt..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 mt-1 outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase">Icon (FontAwesome)</label>
                        <input type="text" id="gIcon" placeholder="fa-store" value="fa-gamepad" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 mt-1 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase">Màu chủ đạo (Tiếng Anh)</label>
                        <select id="gColor" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 mt-1 outline-none text-slate-300">
                            <option value="blue">Xanh dương (Blue)</option>
                            <option value="purple">Tím (Purple)</option>
                            <option value="emerald">Xanh lá (Emerald)</option>
                            <option value="amber">Vàng/Cam (Amber)</option>
                            <option value="red">Đỏ (Red)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-400 uppercase mb-1">File Game (.HTML)</label>
                <div id="dropZone" class="flex-1 border-2 border-dashed border-slate-700 rounded-xl flex flex-col items-center justify-center p-6 text-center hover:border-blue-500 hover:bg-slate-800/50 transition cursor-pointer relative">
                    <input type="file" id="gFile" accept=".html" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-500 mb-3"></i>
                    <p id="fileName" class="text-sm font-medium text-slate-300">Kéo thả file HTML vào đây<br><span class="text-xs text-slate-500 font-normal">hoặc click để chọn</span></p>
                </div>
                
                <button id="btnUpload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg mt-4 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-upload"></i> ĐĂNG GAME LÊN WEB
                </button>
                <p id="statusTxt" class="text-center text-xs mt-3 text-emerald-400 font-mono"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
        import { getFirestore, collection, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALMfE9AfEaRGSgSp6IghU5Cu9uIs54-ac",
            authDomain: "gamhub-f3381.firebaseapp.com",
            projectId: "gamhub-f3381",
            storageBucket: "gamhub-f3381.firebasestorage.app",
            messagingSenderId: "567076365200",
            appId: "1:567076365200:web:5f3bc16acb90d8e27d8915"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);
        const db = getFirestore(app);

        // UI Elements
        const loginPanel = document.getElementById('loginPanel');
        const adminPanel = document.getElementById('adminPanel');
        const statusTxt = document.getElementById('statusTxt');
        let selectedFile = null;

        // Xử lý Login
        document.getElementById('btnLogin').addEventListener('click', () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Sai tài khoản hoặc mật khẩu!"));
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, user => {
            if (user) {
                loginPanel.classList.add('hidden');
                adminPanel.classList.remove('hidden');
            } else {
                loginPanel.classList.remove('hidden');
                adminPanel.classList.add('hidden');
            }
        });

        // Xử lý chọn file
        document.getElementById('gFile').addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('fileName').innerHTML = `<span class="text-blue-400">${selectedFile.name}</span>`;
            }
        });

        // Xử lý Upload Game
        document.getElementById('btnUpload').addEventListener('click', async () => {
            const id = document.getElementById('gId').value.trim();
            const name = document.getElementById('gName').value.trim();
            const desc = document.getElementById('gDesc').value.trim();
            const icon = document.getElementById('gIcon').value.trim();
            const color = document.getElementById('gColor').value;

            if(!id || !name || !selectedFile) return alert("Vui lòng nhập đủ ID, Tên và chọn file HTML!");

            const btn = document.getElementById('btnUpload');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> ĐANG TẢI LÊN...';
            statusTxt.textContent = "Đang tải file lên Cloud Storage...";

            try {
                // 1. Up file html lên Storage
                const fileRef = ref(storage, `games/${id}.html`);
                await uploadBytes(fileRef, selectedFile);
                const fileUrl = await getDownloadURL(fileRef);

                statusTxt.textContent = "Đang lưu dữ liệu vào Database...";

                // 2. Lưu thông tin vào Database
                await setDoc(doc(db, "games", id), {
                    id: id,
                    name: name,
                    description: desc,
                    icon: icon,
                    color: color,
                    url: fileUrl,
                    createdAt: serverTimestamp()
                });

                statusTxt.textContent = "TẢI LÊN THÀNH CÔNG! TRANG CHỦ ĐÃ ĐƯỢC CẬP NHẬT.";
                setTimeout(() => { statusTxt.textContent = ""; document.getElementById('fileName').innerHTML = "Kéo thả file HTML vào đây"; }, 3000);
            } catch (error) {
                console.error(error);
                alert("Lỗi khi tải lên: " + error.message);
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-upload"></i> ĐĂNG GAME LÊN WEB';
        });
    </script>
</body>
</html>
