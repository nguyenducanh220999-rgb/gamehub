<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamhub Circuit — AAA 3D Edition (Patch V2)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap');

        /* ─── THEME VARIABLES ─── */
        :root { 
            --bg: #0b1120; --panel-bg: #151e32; --cell-bg: #1e293b; --cell-act: #0f172a;
            --wire: #00f0ff; --wire-dim: #008b99; --wire-glow: rgba(0, 240, 255, 0.4);
            --bulb: #fbbf24; --bulb-glow: rgba(251, 191, 36, 0.5);
            --border: #334155; --border-act: #00f0ff; --depth: #09101d; --grid: rgba(148,163,184,0.05);
        }
        body.pipeline { 
            --bg: #0f172a; --panel-bg: #1e293b; --cell-bg: #334155; --cell-act: #1e293b;
            --wire: #0ea5e9; --wire-dim: #0284c7; --wire-glow: rgba(14, 165, 233, 0.5);
            --bulb: #38bdf8; --bulb-glow: rgba(56, 189, 248, 0.5);
            --border: #64748b; --border-act: #0ea5e9; --depth: #0f172a; --grid: rgba(14,165,233,0.05);
        }
        body.cyberpunk { 
            --bg: #11001c; --panel-bg: #2a0a33; --cell-bg: #3d154b; --cell-act: #1a0024;
            --wire: #ff0055; --wire-dim: #990033; --wire-glow: rgba(255, 0, 85, 0.5);
            --bulb: #00ffff; --bulb-glow: rgba(0, 255, 255, 0.6);
            --border: #5e1c73; --border-act: #ff0055; --depth: #0b0012; --grid: rgba(255,0,85,0.05);
        }
        body.steampunk { 
            --bg: #1a1311; --panel-bg: #2c1e16; --cell-bg: #4a3020; --cell-act: #1c100a;
            --wire: #ff8800; --wire-dim: #994400; --wire-glow: rgba(255, 136, 0, 0.5);
            --bulb: #ffaa00; --bulb-glow: rgba(255, 170, 0, 0.5);
            --border: #5c3a21; --border-act: #ff8800; --depth: #0f0a08; --grid: rgba(255,136,0,0.05);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; 
            height: 100vh; overflow: hidden; margin: 0; user-select: none; transition: background 0.5s; 
            display: flex; flex-direction: column;
        }
        
        body::before { 
            content: ''; position: fixed; inset: 0; z-index: 0; 
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); 
            background-size: 30px 30px; box-shadow: inset 0 0 100px rgba(0,0,0,0.8); pointer-events: none;
        }
        body::after { content: ''; position: fixed; inset: 0; z-index: 9998; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.4) 100%); background-size: 100% 4px, 100% 100%; opacity: 0.8; }

        #mouse-light { position: fixed; inset: 0; pointer-events: none; z-index: 9997; background: radial-gradient(circle 350px at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.08), transparent); mix-blend-mode: overlay; transition: opacity 0.3s; }

        /* ─── FIX LAYOUT: Root & Game UI ─── */
        #root {
            flex: 1; /* Ép Root chiếm toàn bộ chiều cao còn lại của body */
            width: 100%;
            display: flex;
            flex-direction: column;
            z-index: 2;
            position: relative;
        }

        #game-ui { 
            flex: 1; /* Chiếm 100% Root */
            display: flex; flex-direction: column; 
            width: 100%; padding-top: 15px; box-sizing: border-box;
        }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px; flex-shrink: 0;}
        .top-info h1 { font-family: 'Orbitron'; font-size: 1.5em; margin: 0; color: var(--wire); text-shadow: 0 0 10px var(--wire-glow); }
        .top-info .level-txt { font-size: 1.2em; font-weight: 700; color: #fff; background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 4px; border: 1px solid var(--border); display: inline-block; margin-top: 5px;}
        #timer-board { font-family: 'Orbitron'; font-size: 2em; color: var(--bulb); font-weight: 700; background: #000; padding: 5px 20px; border: 2px solid var(--bulb); border-radius: 8px; box-shadow: 0 0 15px var(--bulb-glow); }
        
        .tool-bar { display: flex; gap: 10px; }
        .btn-tool { padding: 8px 15px; font-family: 'Rajdhani'; font-weight: 700; font-size: 1em; background: #000; color: #fff; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: 0.2s; text-transform: uppercase;}
        .btn-tool:hover { border-color: var(--wire); color: var(--wire); box-shadow: inset 0 0 10px var(--wire-glow); }
        
        #btn-3d { border-color: var(--wire); color: var(--wire); box-shadow: inset 0 0 5px var(--wire-glow); position: relative; overflow: hidden;}
        #btn-3d.active { background: var(--wire); color: #000; box-shadow: 0 0 20px var(--wire-glow); }

        /* ─── FIX CANH TÂM TUYỆT ĐỐI (ABSOLUTE CENTERING) ─── */
        #scene { flex: 1; width: 100%; position: relative; perspective: 1500px; overflow: hidden; }
        #perspective-wrapper { 
            position: absolute; top: 50%; left: 50%; 
            /* Gộp Scale và 3D Rotate vào chung 1 transform để không bao giờ bị đè lệnh mất canh giữa */
            transform: translate(-50%, -50%) scale(var(--scale, 1)) scale(var(--zoom, 1)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) rotateZ(var(--rz, 0deg)); 
            transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        #game-container {
            position: relative;
            background: var(--panel-bg); border-radius: 12px; border: 2px solid var(--border);
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.5);
            padding: 80px; transform-style: preserve-3d; transition: 0.5s;
        }

        /* ─── CƠ CHẾ 3D SCAN: TÁCH RIÊNG KHỎI TRANSFORM KHUNG ─── */
        /* Chỉ tác động Shadow của Container và Màu của Cell hỏng */
        #game-container.is-3d {
            box-shadow: -15px 30px 60px rgba(0,0,0,0.95), 0 0 0 1px var(--border-act), inset 0 0 60px rgba(0,0,0,0.3);
        }
        #game-container.is-3d .cell.broken {
            --tz: -15px; /* Lún xuống mà không ghi đè biến --rot của góc xoay mạch */
            background: #2a0505; border-color: #ff0000; box-shadow: inset 0 0 20px #000;
        }
        #game-container.is-3d .cell.broken .wire { background: #4a1111; box-shadow: none; }
        #game-container.is-3d .cell.broken .wire::after { display: none; }
        #game-container.is-3d .cell.broken::before { background: #330000; border-color: #ff0000;}
        #game-container.is-3d .cell.broken::after {
            content: '⚠'; position: absolute; top: 50%; left: 50%;
            /* Tính toán đối nghịch để biển báo ⚠ luôn chổng ngược lên và quay mặt vào người chơi */
            transform: translate(-50%, -50%) rotate(calc(var(--rot) * -1)) translateZ(20px) rotateZ(35deg) rotateX(-55deg); 
            color: #ff3333; font-size: 24px; text-shadow: 0 0 15px red;
            animation: alert-pulse 0.5s infinite alternate; pointer-events: none; z-index: 10;
        }
        @keyframes alert-pulse { from { opacity: 0.5; } to { opacity: 1; } }

        #board-wrapper { position: absolute; top: 80px; left: 80px; transform-style: preserve-3d; }
        #fx-canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; transform: translateZ(10px); }
        
        #board { 
            position: relative; display: grid; gap: 6px; padding: 8px; border-radius: 6px; border: 1px solid var(--border); transform: translateZ(2px); transition: 0.5s; 
            background: radial-gradient(black 15%, transparent 16%) 0 0, radial-gradient(black 15%, transparent 16%) 8px 8px, radial-gradient(rgba(255,255,255,.05) 15%, transparent 20%) 0 1px, radial-gradient(rgba(255,255,255,.05) 15%, transparent 20%) 8px 9px;
            background-color: #0c0c0c; background-size: 16px 16px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .port-in, .port-out { position: absolute; z-index: 1; background: var(--cell-bg); transform: translateZ(3px); transition: 0.5s; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); pointer-events: none; }
        .port-top { top:-36px; left:8px; width:60px; height:36px; border: 2px solid var(--wire-dim); border-bottom:none; border-radius:4px 4px 0 0; }
        .port-left { bottom:8px; left:-36px; width:36px; height:60px; border: 2px solid var(--wire-dim); border-right:none; border-radius:4px 0 0 4px; }
        .port-in::after { content: '+'; position:absolute; color:var(--wire); font-weight:900; font-size:18px; text-shadow:0 0 10px var(--wire); animation: pulse 1s infinite alternate;}
        .port-top::after { top:-20px; left:25px; } .port-left::after { left:-20px; top:20px; }
        .port-right { top:14px; right:-48px; width:48px; height:48px; border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; background: #111;}
        .port-bottom { bottom:-48px; right:14px; width:48px; height:48px; border-radius:8px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:22px; background: #111;}
        
        .port-out::before { content:'💡'; filter:grayscale(1); opacity:0.2; transition: 0.3s; }
        .port-out.active { border-color:var(--bulb); box-shadow:0 0 30px var(--bulb-glow), inset 0 0 20px var(--bulb-glow); background:#1a1a1a;}
        .port-out.active::before { filter:none; opacity:1; text-shadow:0 0 20px var(--bulb); transform: scale(1.1); }

        @keyframes dropIn { 0% { transform: translateZ(100px) scale(0.5); opacity: 0; } 100% { transform: translateZ(0px) scale(1); opacity: 1; } }

        /* SỬA LẠI TRANSFORM CỦA CELL BẰNG BIẾN CSS */
        .cell {
            width: 60px; height: 60px; background: var(--cell-bg); border-radius: 4px; position: relative; cursor: pointer;
            border: 1px solid var(--border); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s, background 0.2s; 
            --w-col: #94a3b8; --elec: 0; 
            --tz: 0px; --rot: 0deg;
            transform-style: preserve-3d; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            /* Bọc TranslateZ và Rotate chung 1 dòng để không triệt tiêu nhau */
            transform: translateZ(var(--tz)) rotate(var(--rot));
            animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; 
        }
        .cell:hover { background: var(--cell-act); --tz: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05); z-index: 10;}
        .cell:active { --tz: 0px; }
        .cell.active { --w-col: var(--wire); --elec: 1; border-color: var(--border-act); box-shadow: 0 0 15px var(--wire-glow), inset 0 0 10px var(--wire-glow); }

        .wire { position: absolute; background: var(--w-col); border-radius: 4px; transition: 0.2s; z-index: 2; transform: translateZ(1px); box-shadow: inset 0 2px 5px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(0,0,0,0.6), 0 4px 6px rgba(0,0,0,0.5); }
        .cell.active .wire { box-shadow: 0 0 10px var(--wire-glow), inset 0 2px 5px rgba(255,255,255,0.5); }
        .wire::after { content:''; position:absolute; opacity:var(--elec); transition:0.2s; box-shadow:0 0 12px var(--wire); }
        
        .p-I .wire-body { top:0; left:20px; width:20px; height:60px; }
        .p-I .wire-body::after { top:0; left:4px; width:12px; height:60px; background-image: repeating-linear-gradient(to bottom, var(--wire) 0px, var(--wire) 6px, transparent 6px, transparent 12px); animation: fw-v 0.6s linear infinite; }
        .p-L .wire-v { top:0; left:20px; width:20px; height:40px; border-radius:0 0 0 4px;}
        .p-L .wire-h { top:20px; left:20px; width:40px; height:20px; }
        .p-L .wire-v::after { top:0; left:4px; width:12px; height:36px; background-image: repeating-linear-gradient(to bottom, var(--wire) 0px, var(--wire) 6px, transparent 6px, transparent 12px); animation: fw-v 0.6s linear infinite; }
        .p-L .wire-h::after { top:4px; left:12px; width:28px; height:12px; background-image: repeating-linear-gradient(to right, var(--wire) 0px, var(--wire) 6px, transparent 6px, transparent 12px); animation: fw-h 0.6s linear infinite; }

        @keyframes fw-v { 0%{background-position:0 0;} 100%{background-position:0 12px;} }
        @keyframes fw-h { 0%{background-position:0 0;} 100%{background-position:12px 0;} }
        @keyframes pulse { 0%{opacity:0.5;} 100%{opacity:1;} }

        .cell::before { content:''; position:absolute; top:22px; left:22px; width:16px; height:16px; background:#475569; border-radius:50%; z-index:4; transform: translateZ(2px); transition:0.2s; box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), 0 2px 4px rgba(0,0,0,0.8);}
        .cell.active::before { background:var(--wire); box-shadow:0 0 10px var(--wire); }

        .bottom-action { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; z-index: 1000;}
        #btn-next { padding: 15px 40px; font-size: 1.2em; font-family: 'Orbitron'; font-weight: 900; background: var(--bulb); color: #000; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 6px 0 #b45309, 0 10px 20px rgba(0,0,0,0.8); transition: 0.1s; text-transform: uppercase;}
        #btn-next:active { transform: translateY(6px); box-shadow: 0 0 0 #b45309, 0 0 0 rgba(0,0,0,0); }

        #hint-text { position: fixed; bottom: 15px; left: 15px; color: rgba(255,255,255,0.4); font-size: 0.8em; z-index: 10; pointer-events: none; max-width: 300px;}
        #hint-text span { color: var(--wire); font-weight: bold;}
    </style>
</head>
<body>

<div id="mouse-light"></div>

<div id="root">
    <div id="game-ui">
        <div class="header-bar">
            <div class="top-info">
                <h1>HỆ THỐNG ĐIỆN KÉP</h1>
                <div class="level-txt" id="level-title">LVL 1</div>
            </div>
            
            <div id="timer-board">02:00</div>

            <div class="tool-bar">
                <button class="btn-tool" onclick="cycleTheme()" id="btn-theme">🎨 SKIN: TECH</button>
                <button class="btn-tool" onclick="toggle3D()" id="btn-3d">👁️ 3D SCAN: OFF</button>
                <button class="btn-tool" onclick="reset3DView()" id="btn-3d-reset" style="display:none;color:var(--wire)">⟳ ĐẶT LẠI GÓC</button>
                <button class="btn-tool" onclick="initLevel()" style="color:var(--bulb)">↺ REBOOT</button>
            </div>
        </div>

        <div id="scene">
            <div id="perspective-wrapper">
                <div id="game-container">
                    <div id="board-wrapper">
                        <canvas id="fx-canvas"></canvas>
                        <div id="board">
                            <div class="port-in port-top" id="port-in-1"></div>
                            <div class="port-in port-left" id="port-in-2"></div>
                            <div class="port-out port-right" id="port-out-1"></div>
                            <div class="port-out port-bottom" id="port-out-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-action" id="action-wrapper">
            <button id="btn-next" onclick="nextLevel()">CẤP QUYỀN TIẾP THEO ▶</button>
        </div>
        
        <div id="hint-text">Bí đường? Hãy kích hoạt <span>3D SCAN</span> để soi các linh kiện bị cháy hỏng dưới bảng mạch!</div>
    </div>
</div>

<script>
    document.addEventListener('mousemove', (e) => {
        document.body.style.setProperty('--mx', e.clientX + 'px');
        document.body.style.setProperty('--my', e.clientY + 'px');
    });

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
    document.body.addEventListener('pointerdown', initAudio, { once: true });

    function playSound(freq, type, duration, vol) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function sfxConnect() { playSound(600, 'sine', 0.08, 0.1); setTimeout(() => playSound(900, 'triangle', 0.15, 0.08), 50); }    
    function sfxDisconnect() { playSound(150, 'square', 0.1, 0.08); setTimeout(() => playSound(100, 'sawtooth', 0.15, 0.05), 40); }   
    function sfxBulbOn() { playSound(880, 'sine', 0.4, 0.1); setTimeout(() => playSound(1108.73, 'sine', 0.4, 0.1), 100); setTimeout(() => playSound(1318.51, 'sine', 0.8, 0.15), 200); }

    const boardEl = document.getElementById('board');
    const boardWrapper = document.getElementById('board-wrapper');
    const gameContainer = document.getElementById('game-container');
    const perspectiveWrapper = document.getElementById('perspective-wrapper');
    const portOut1 = document.getElementById('port-out-1');
    const portOut2 = document.getElementById('port-out-2');
    const actionWrap = document.getElementById('action-wrapper');
    const timerBoard = document.getElementById('timer-board');
    
    let currentLevel = 1, size = 9, grid = [];
    let gameWon = false, gameOver = false;
    let timeLeft = 120, timerInterval = null, currentMaxTime = 120; 
    let is3D = false;
    
    const themes = ['', 'pipeline', 'cyberpunk', 'steampunk'];
    const themeNames = ['TECH', 'WATER', 'CYBER', 'STEAM'];
    let currentThemeIdx = 0;

    const shapes = { 'I': [1,0,1,0], 'L': [1,1,0,0] };

    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas(boardSize) { canvas.width = boardSize; canvas.height = boardSize; }

    function spawnSparks(r, c) {
        let cx = (c * 66) + 38; let cy = (r * 66) + 38;
        let colorStr = getComputedStyle(document.body).getPropertyValue('--wire').trim() || '#00f0ff';
        for(let i=0; i<12; i++) {
            particles.push({ x: cx, y: cy, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color: colorStr });
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.03;
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.shadowBlur = 8; ctx.shadowColor = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ─── ĐIỀU KHIỂN TƯƠNG TÁC GÓC XOAY 3D ───
    let rotX = 0, rotY = 0, rotZ = 0, zoom3d = 1;
    let isDragging = false, lastMX = 0, lastMY = 0;
    
    function apply3DTransform() {
        perspectiveWrapper.style.setProperty('--rx', `${rotX}deg`);
        perspectiveWrapper.style.setProperty('--ry', `${rotY}deg`);
        perspectiveWrapper.style.setProperty('--rz', `${rotZ}deg`);
        perspectiveWrapper.style.setProperty('--zoom', zoom3d);
    }

    const sceneEl = document.getElementById('scene');
    sceneEl.addEventListener('mousedown', (e) => {
        if (!is3D || e.target.closest('.cell') || e.target.closest('.btn-tool')) return;
        isDragging = true; lastMX = e.clientX; lastMY = e.clientY;
        sceneEl.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let dx = e.clientX - lastMX, dy = e.clientY - lastMY;
        rotX = Math.max(0, Math.min(80, rotX - dy * 0.35));
        rotZ += dx * 0.35;
        lastMX = e.clientX; lastMY = e.clientY;
        apply3DTransform();
    });
    window.addEventListener('mouseup', () => { isDragging = false; sceneEl.style.cursor = 'default';});

    sceneEl.addEventListener('wheel', (e) => {
        if (!is3D) return; e.preventDefault();
        zoom3d = Math.max(0.5, Math.min(1.5, zoom3d - e.deltaY * 0.001));
        apply3DTransform();
    }, { passive: false });

    function reset3DView() { rotX = 55; rotY = 0; rotZ = -35; zoom3d = 1; apply3DTransform(); }

    function toggle3D() {
        is3D = !is3D;
        const btn = document.getElementById('btn-3d');
        const resetBtn = document.getElementById('btn-3d-reset');
        if (is3D) {
            rotX = 55; rotY = 0; rotZ = -35; zoom3d = 1;
            gameContainer.classList.add('is-3d'); // Add class để nổi mảng đỏ các linh kiện hỏng
            btn.innerText = '👁️ 3D SCAN: ON'; btn.classList.add('active');
            resetBtn.style.display = 'inline-block';
            playSound(400, 'square', 0.2, 0.1);
        } else {
            rotX = 0; rotY = 0; rotZ = 0; zoom3d = 1;
            gameContainer.classList.remove('is-3d');
            btn.innerText = '👁️ 3D SCAN: OFF'; btn.classList.remove('active');
            resetBtn.style.display = 'none';
        }
        apply3DTransform();
    }

    function cycleTheme() {
        currentThemeIdx = (currentThemeIdx + 1) % themes.length;
        document.body.className = themes[currentThemeIdx];
        document.getElementById('btn-theme').innerText = '🎨 SKIN: ' + themeNames[currentThemeIdx];
    }

    // ─── TÍNH TOÁN CANH GIỮA HOÀN HẢO BẰNG TOÁN HỌC ───
    function adjustScale() {
        let padding = 80;
        let boardSize = (size * 60) + ((size - 1) * 6) + 16; 
        let containerSize = boardSize + (padding * 2);

        gameContainer.style.width = `${containerSize}px`; gameContainer.style.height = `${containerSize}px`;
        boardWrapper.style.width = `${boardSize}px`; boardWrapper.style.height = `${boardSize}px`;
        perspectiveWrapper.style.width = `${containerSize}px`; perspectiveWrapper.style.height = `${containerSize}px`;
        resizeCanvas(boardSize);

        let maxWidth = sceneEl.clientWidth - 40; let maxHeight = sceneEl.clientHeight - 40; 
        let scale = 1;
        
        // Khắc phục lỗi chiều cao âm khi flexbox chưa bung đủ 100vh
        if (maxWidth > 0 && maxHeight > 0) {
            if (containerSize > maxWidth || containerSize > maxHeight) {
                scale = Math.min(maxWidth / containerSize, maxHeight / containerSize);
            }
        } else {
            scale = 0.5; // Fallback an toàn trên mobile
        }

        perspectiveWrapper.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', () => { if(grid.length > 0) adjustScale(); });

    function formatTime(s) { let m = Math.floor(s / 60); let sec = s % 60; return `0${m}:${sec < 10 ? '0'+sec : sec}`; }

    function startTimer() {
        clearInterval(timerInterval); timeLeft = currentMaxTime; 
        timerBoard.innerText = formatTime(timeLeft); timerBoard.classList.remove('warning');
        timerInterval = setInterval(() => {
            if (gameWon || gameOver) { clearInterval(timerInterval); return; }
            timeLeft--; timerBoard.innerText = formatTime(timeLeft);
            if (timeLeft <= 15) timerBoard.classList.add('warning');
            if (timeLeft <= 0) {
                gameOver = true; clearInterval(timerInterval); sfxDisconnect();
                setTimeout(() => alert("HẾT THỜI GIAN! Hãy ấn REBOOT để chơi lại màn này nhé."), 100);
            }
        }, 1000);
    }

    function generateDualLevelData() {
        size = 8 + Math.ceil(currentLevel / 5); if (size > 14) size = 14; 
        currentMaxTime = 120 + ((size - 9) * 30); 

        boardEl.style.gridTemplateColumns = `repeat(${size}, 60px)`; boardEl.style.gridTemplateRows = `repeat(${size}, 60px)`;
        let levelData = Array.from({length: size}, () => Array.from({length: size}, () => ({ type: Math.random() > 0.5 ? 'I' : 'L', broken: false, isPath: false })));
        
        let half = Math.floor(size / 2);
        
        let r1 = 0; let inDir1 = 0; 
        for (let c = 0; c < size; c++) {
            let next_r = (c === size - 1) ? 0 : Math.floor(Math.random() * half);
            while (r1 < next_r) { levelData[r1][c].type = (inDir1 === 0) ? 'I' : 'L'; levelData[r1][c].isPath = true; inDir1 = 0; r1++; } 
            while (r1 > next_r) { levelData[r1][c].type = (inDir1 === 2) ? 'I' : 'L'; levelData[r1][c].isPath = true; inDir1 = 2; r1--; } 
            if (c < size - 1) { levelData[r1][c].type = (inDir1 === 3) ? 'I' : 'L'; levelData[r1][c].isPath = true; inDir1 = 3; } 
            else { levelData[r1][c].type = (inDir1 === 3) ? 'I' : 'L'; levelData[r1][c].isPath = true; } 
        }
        let r2 = size - 1; let inDir2 = 3;
        for (let c = 0; c < size; c++) {
            let next_r = (c === size - 1) ? size - 1 : half + Math.floor(Math.random() * (size - half));
            while (r2 < next_r) { levelData[r2][c].type = (inDir2 === 0) ? 'I' : 'L'; levelData[r2][c].isPath = true; inDir2 = 0; r2++; }
            while (r2 > next_r) { levelData[r2][c].type = (inDir2 === 2) ? 'I' : 'L'; levelData[r2][c].isPath = true; inDir2 = 2; r2--; }
            if (c < size - 1) { levelData[r2][c].type = (inDir2 === 3) ? 'I' : 'L'; levelData[r2][c].isPath = true; inDir2 = 3; } 
            else { levelData[r2][c].type = (inDir2 === 0) ? 'I' : 'L'; levelData[r2][c].isPath = true; } 
        }

        let maxBroken = Math.floor((size * size) * 0.10);
        let coords = [];
        for(let r=0; r<size; r++) for(let c=0; c<size; c++) if(!levelData[r][c].isPath) coords.push({r,c});
        coords.sort(() => Math.random() - 0.5); 
        for(let i=0; i<Math.min(maxBroken, coords.length); i++) {
            levelData[coords[i].r][coords[i].c].broken = true;
        }

        return levelData;
    }

    function initLevel() {
        Array.from(boardEl.children).forEach(child => { if(child.classList.contains('cell')) child.remove(); });
        grid = []; gameWon = false; gameOver = false; particles = [];
        portOut1.classList.remove('active'); portOut2.classList.remove('active');
        actionWrap.style.display = 'none';
        document.getElementById('level-title').innerText = `LVL ${currentLevel}`;

        let levelData = generateDualLevelData();
        
        // Timeout nhỏ để đảm bảo Container tải xong height mới bắt đầu đo kích thước canh giữa
        setTimeout(() => { adjustScale(); }, 10);

        for (let r=0; r<size; r++) {
            let row = [];
            for (let c=0; c<size; c++) {
                let data = levelData[r][c];
                let type = data.type; let rotSteps = Math.floor(Math.random() * 4);
                let conns = [...shapes[type]]; for (let i=0; i<rotSteps; i++) conns.unshift(conns.pop());

                let cellObj = { type, rotSteps, deg: rotSteps*90, conns, active: false, broken: data.broken, el: null };
                let cellEl = document.createElement('div'); cellEl.className = 'cell';
                if(data.broken) cellEl.classList.add('broken'); 

                cellEl.style.animationDelay = `${(r * 0.02) + (c * 0.02) + (Math.random() * 0.1)}s`;

                let wireHTML = `<div class="p-${type}">`;
                if (type === 'I') wireHTML += `<div class="wire wire-body"></div>`; else wireHTML += `<div class="wire wire-v"></div><div class="wire wire-h"></div>`;
                wireHTML += `</div>`; cellEl.innerHTML += wireHTML;

                cellEl.style.setProperty('--rot', `${cellObj.deg}deg`);
                
                // Mousedown thay vì click để nhạy bén và không bị block
                cellEl.addEventListener('mousedown', () => { 
                    initAudio(); if (!gameWon && !gameOver) rotateCell(r, c); 
                });

                cellObj.el = cellEl; boardEl.appendChild(cellEl); row.push(cellObj);
            }
            grid.push(row);
        }
        updateFlow(true); 
        startTimer();
    }

    function rotateCell(r, c) {
        let cell = grid[r][c];
        cell.conns.unshift(cell.conns.pop()); cell.rotSteps = (cell.rotSteps + 1) % 4;
        cell.deg += 90; 
        
        cell.el.style.setProperty('--rot', `${cell.deg}deg`);
        
        spawnSparks(r, c); updateFlow(false);
    }

    function updateFlow(isInit) {
        let activeCountOld = 0;
        for (let r=0; r<size; r++) for (let c=0; c<size; c++) if (grid[r][c].active) activeCountOld++;
        let bulb1WasOn = portOut1.classList.contains('active'); let bulb2WasOn = portOut2.classList.contains('active');

        for (let r=0; r<size; r++) for (let c=0; c<size; c++) { grid[r][c].active = false; grid[r][c].el.classList.remove('active'); }
        portOut1.classList.remove('active'); portOut2.classList.remove('active');

        let queue = [];
        if (grid[0][0].conns[0]) { grid[0][0].active = true; grid[0][0].el.classList.add('active'); queue.push([0, 0]); }
        if (grid[size-1][0].conns[3]) { grid[size-1][0].active = true; grid[size-1][0].el.classList.add('active'); queue.push([size-1, 0]); }

        let out1Active = false, out2Active = false;
        while (queue.length > 0) {
            let [r, c] = queue.shift(); let curr = grid[r][c];
            if (r === 0 && c === size-1 && curr.conns[1]) out1Active = true;
            if (r === size-1 && c === size-1 && curr.conns[2]) out2Active = true;

            if (curr.conns[0] && r>0      && grid[r-1][c].conns[2] && !grid[r-1][c].active && !grid[r-1][c].broken) { grid[r-1][c].active=true; grid[r-1][c].el.classList.add('active'); queue.push([r-1,c]); }
            if (curr.conns[1] && c<size-1 && grid[r][c+1].conns[3] && !grid[r][c+1].active && !grid[r][c+1].broken) { grid[r][c+1].active=true; grid[r][c+1].el.classList.add('active'); queue.push([r,c+1]); }
            if (curr.conns[2] && r<size-1 && grid[r+1][c].conns[0] && !grid[r+1][c].active && !grid[r+1][c].broken) { grid[r+1][c].active=true; grid[r+1][c].el.classList.add('active'); queue.push([r+1,c]); }
            if (curr.conns[3] && c>0      && grid[r][c-1].conns[1] && !grid[r][c-1].active && !grid[r][c-1].broken) { grid[r][c-1].active=true; grid[r][c-1].el.classList.add('active'); queue.push([r,c-1]); }
        }

        if (out1Active) portOut1.classList.add('active');
        if (out2Active) portOut2.classList.add('active');

        if (!isInit) {
            let activeCountNew = 0;
            for (let r=0; r<size; r++) for (let c=0; c<size; c++) if (grid[r][c].active) activeCountNew++;
            if ((out1Active && !bulb1WasOn) || (out2Active && !bulb2WasOn)) sfxBulbOn();
            else if (activeCountNew > activeCountOld) sfxConnect(); 
            else if (activeCountNew < activeCountOld) sfxDisconnect(); 
        }

        if (out1Active && out2Active && !gameWon) {
            gameWon = true; timerBoard.classList.remove('warning');
            for (let rr=0; rr<size; rr++)
                for (let cc=0; cc<size; cc++)
                    if (grid[rr][cc].active) setTimeout(() => spawnSparks(rr, cc), Math.random()*400);
            
            setTimeout(() => { actionWrap.style.display = 'block'; }, 800);
        }
    }

    function nextLevel() { 
        currentLevel++; 
        try { localStorage.setItem('gamhub_circuit_level', currentLevel); } catch (e) {}
        initLevel(); 
    }

    window.onload = () => { initLevel(); };
</script>
