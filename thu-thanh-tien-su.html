<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thủ Thành Tiền Sử — Kỷ Nguyên Mãnh Thú</title>
<meta name="description" content="Game thủ thành / tower defense chủ đề tiền sử. 100 đợt, 18 loài mãnh thú, 6 loại vũ khí cổ đại nâng cấp 5 cấp. Song ngữ Việt–Anh.">
<style>
:root{
  --stone-0:#0e0b09; --stone-1:#181310; --stone-2:#231b15; --stone-3:#31251c;
  --line:#4a382a; --bone:#efe3cd; --bone-dim:#b8a68b;
  --amber:#f2a83c; --amber-2:#ffd07a; --ember:#e05a2b;
  --jade:#7fc45c; --ice:#68c8e8; --blood:#c0392b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:
  radial-gradient(1200px 700px at 50% -10%, #2b1d15 0%, #120d0a 60%, #0a0706 100%);
  color:var(--bone);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  min-height:100%;
}
body{padding:14px 12px 26px;overscroll-behavior:none}
#app{max-width:1420px;margin:0 auto}

/* ---------- Header ---------- */
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:44px;height:44px;flex:none;border-radius:12px;
  background:linear-gradient(160deg,#3a2a1d,#1a120d);border:1px solid var(--line);
  display:grid;place-items:center;font-size:22px;box-shadow:0 0 18px rgba(242,168,60,.18) inset}
.brand h1{margin:0;font-size:20px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bone);text-shadow:0 2px 0 #000,0 0 22px rgba(242,168,60,.25);white-space:nowrap}
.brand p{margin:2px 0 0;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-dim)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:linear-gradient(180deg,var(--stone-2),var(--stone-1));border:1px solid var(--line);
  border-radius:10px;padding:7px 13px;min-width:96px;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.stat b{display:block;font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-dim)}
.stat.hp b{color:#ff8e7a} .stat.gold b{color:var(--amber-2)} .stat.wave b{color:var(--jade)}

/* ---------- Layout ---------- */
#stage{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:14px;align-items:start}
#board{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:#0d1508;box-shadow:0 18px 44px rgba(0,0,0,.6), 0 0 0 4px rgba(0,0,0,.35)}
canvas#game{display:block;width:100%;height:auto;touch-action:manipulation;cursor:crosshair}

/* ---------- Sidebar ---------- */
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:linear-gradient(180deg,var(--stone-2),var(--stone-1));border:1px solid var(--line);
  border-radius:12px;padding:11px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.panel h2{margin:0 0 9px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber);
  display:flex;justify-content:space-between;align-items:center}
.panel h2 em{font-style:normal;color:var(--bone-dim);letter-spacing:.06em;text-transform:none;font-size:11px}

.shop{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{position:relative;display:flex;gap:8px;align-items:center;padding:7px;border-radius:9px;cursor:pointer;
  background:linear-gradient(180deg,#2e241b,#1d1611);border:1px solid #3d2f23;transition:.13s;text-align:left}
.card:hover{transform:translateY(-2px);border-color:var(--amber);background:linear-gradient(180deg,#3b2d21,#241b14)}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 16px rgba(242,168,60,.3) inset}
.card.poor{opacity:.42;cursor:not-allowed}
.card canvas{width:38px;height:38px;flex:none;border-radius:7px;background:rgba(0,0,0,.3)}
.card .n{font-size:11.5px;font-weight:bold;line-height:1.2}
.card .c{font-size:11px;color:var(--amber-2);font-variant-numeric:tabular-nums}

#info{display:none}
#info.on{display:block}
.rowline{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #382a20}
.rowline span{color:var(--bone-dim)} .rowline b{font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;font-weight:bold;color:var(--bone);cursor:pointer;
  border:1px solid var(--line);border-radius:8px;padding:8px 11px;
  background:linear-gradient(180deg,#3a2c20,#241b14);box-shadow:0 3px 0 rgba(0,0,0,.5);transition:.12s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--amber)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.b-go{flex:1;background:linear-gradient(180deg,#3f6b2c,#24401a);border-color:#5b8f3f;font-size:13px;letter-spacing:.06em}
.b-up{flex:1;background:linear-gradient(180deg,#6b5220,#3d2f13);border-color:#a37c2c}
.b-sell{background:linear-gradient(180deg,#5e2820,#361713);border-color:#8f4034}
.chip{padding:6px 9px;font-size:11px;flex:1}
.chip.on{background:linear-gradient(180deg,#6b5220,#3d2f13);border-color:var(--amber)}
.hint{font-size:11.5px;line-height:1.55;color:var(--bone-dim)}
.hint b{color:var(--bone)}
.langwrap{display:flex;gap:5px;align-items:center}
.lang{padding:6px 11px;font-size:11px;letter-spacing:.1em;opacity:.55}
.lang.on{opacity:1;background:linear-gradient(180deg,#6b5220,#3d2f13);border-color:var(--amber)}
#nextwave{font-size:12px;line-height:1.5;color:var(--bone-dim)}
#nextwave b{color:var(--bone)}

/* ---------- Modals ---------- */
#veil{position:absolute;inset:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 40%,rgba(20,12,8,.82),rgba(6,4,3,.95));backdrop-filter:blur(3px);z-index:5}
#veil.off{display:none}
.modal{max-width:520px;text-align:center;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 6px;font-size:clamp(22px,4.4vw,36px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--amber-2);text-shadow:0 3px 0 #000,0 0 34px rgba(242,168,60,.45)}
.modal .sub{margin:0 0 16px;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-dim)}
.modal p{font-size:13.5px;line-height:1.75;color:#d9c9ae;margin:0 auto 18px;max-width:430px}
.modal .k{color:var(--amber-2);font-weight:bold}
.modal button{font-size:15px;padding:13px 34px;letter-spacing:.08em;
  background:linear-gradient(180deg,#c9822a,#8a4f16);border-color:#f0b055;color:#fff8e8}
.tally{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tally div{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:9px;padding:8px 16px;min-width:92px}
.tally b{display:block;font-size:20px;color:var(--amber-2)}
.tally span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-dim)}

/* toast */
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;pointer-events:none;
  background:rgba(12,8,6,.9);border:1px solid var(--line);border-radius:8px;padding:8px 16px;
  font-size:12.5px;font-weight:bold;opacity:0;transition:.25s}
#toast.on{opacity:1}

@media (max-width:1080px){
  #stage{grid-template-columns:1fr}
  aside{flex-direction:row;flex-wrap:wrap}
  aside .panel{flex:1 1 260px}
  .shop{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:620px){
  body{padding:10px 8px 20px}
  .shop{grid-template-columns:1fr 1fr}
  .brand h1{font-size:16px} .brand p{display:none}
  .stat{min-width:78px;padding:6px 10px} .stat b{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="mark">🦖</div>
      <div>
        <h1 data-i18n="title">Thủ Thành Tiền Sử</h1>
        <p data-i18n="sub">Kỷ nguyên mãnh thú</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat hp"><b id="s-hp">25</b><span data-i18n="hp">Máu thành</span></div>

      <div class="stat wave"><b id="s-wave">0/100</b><span data-i18n="wave">Đợt tấn công</span></div>
      <div class="stat"><b id="s-score">0</b><span data-i18n="score">Điểm</span></div>
      <div class="langwrap">
        <button class="lang on" id="lang-vi">VI</button>
        <button class="lang" id="lang-en">EN</button>
      </div>
    </div>
  </header>

  <div id="stage">
    <div id="board">
      <canvas id="game"></canvas>
      <div id="toast"></div>
      <div id="veil">
        <div class="modal" id="modal"></div>
      </div>
    </div>

    <aside>
      <div class="panel">
        <h2><span data-i18n="arsenal">Kho vũ khí</span> <em id="shoptip">Chọn rồi đặt lên bãi cỏ</em></h2>
        <div class="shop" id="shop"></div>
      </div>

      <div class="panel" id="info">
        <h2><span data-i18n="building">Công trình</span> <em id="i-lv">Cấp 1</em></h2>
        <div id="i-body"></div>
        <div class="btns">
          <button class="b-up" id="b-up">Nâng cấp</button>
          <button class="b-sell" id="b-sell">Bán</button>
        </div>
        <div class="btns">
          <button class="chip" data-mode="first" data-i18n="mFirst">Đi đầu</button>
          <button class="chip" data-mode="strong" data-i18n="mStrong">Máu cao</button>
          <button class="chip" data-mode="close" data-i18n="mClose">Gần nhất</button>
        </div>
      </div>

      <div class="panel">
        <h2 data-i18n="battle">Trận chiến</h2>
        <div id="nextwave"></div>
        <div class="btns">
          <button class="b-go" id="b-wave">Thả bầy thú</button>
        </div>
        <div class="btns">
          <button class="chip" id="b-speed">Tốc độ 1x</button>
          <button class="chip" id="b-pause">Tạm dừng</button>
          <button class="chip" id="b-sound">Âm thanh: Bật</button>
        </div>
        <div class="btns">
          <button class="chip" id="b-repair" style="flex:1">Sửa thành</button>
        </div>
      </div>

      <div class="panel">
        <h2 data-i18n="tips">Mẹo sinh tồn</h2>
        <p class="hint" id="tipsbody" style="margin:0"></p>
      </div>
    </aside>
  </div>
</div>

}
function limb(c,col,x,y,ph,len,w,spread){

function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

const T=(t)=>t*TILE+TILE/2;
const WP=[[-1,4],[2,4],[2,1],[6,1],[6,7],[10,7],[10,3],[13,3],[13,8],[17,8]].map(p=>({x:T(p[0]),y:T(p[1])}));
// flyers glide along a corner-cut version of the same trail (Chaikin smoothing)
const AIR=(function(){
  let pts=WP.slice();
  for(let it=0;it<2;it++){
    const out=[pts[0]];
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      out.push({x:a.x+(b.x-a.x)*.25,y:a.y+(b.y-a.y)*.25});
      out.push({x:a.x+(b.x-a.x)*.75,y:a.y+(b.y-a.y)*.75});
    }
    out.push(pts[pts.length-1]);
    pts=out;
  }
  return pts;
})();
const pathT=new Set(), blockT=new Set(), decor=[];
(function(){
  for(let i=0;i<WP.length-1;i++){
    const a=WP[i],b=WP[i+1], n=Math.max(1,Math.ceil(dist(a.x,a.y,b.x,b.y)/7));
    for(let s=0;s<=n;s++){
      const x=a.x+(b.x-a.x)*s/n, y=a.y+(b.y-a.y)*s/n;
      for(const ox of [-24,0,24]) for(const oy of [-24,0,24]){
        const tx=Math.floor((x+ox)/TILE), ty=Math.floor((y+oy)/TILE);
        if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS) pathT.add(ty*COLS+tx);
      }
    }
  }
  const pond=[[0,8],[1,8],[0,9],[1,9]], volc=[[13,0],[14,0],[15,0],[13,1],[14,1],[15,1]];
  pond.forEach(p=>blockT.add(p[1]*COLS+p[0]));
  volc.forEach(p=>blockT.add(p[1]*COLS+p[0]));
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const id=ty*COLS+tx;
    if(pathT.has(id)||blockT.has(id))continue;
    const r=srnd();
    if(r<0.15){blockT.add(id);decor.push({x:T(tx)+rnd(-9,9),y:T(ty)+rnd(-6,9),k:r<0.095?'tree':'rock',s:0.8+srnd()*0.5,f:srnd()});}
  }
})();
const isPath=(tx,ty)=>pathT.has(ty*COLS+tx);
const isFree=(tx,ty)=>tx>=0&&tx<COLS&&ty>=0&&ty<ROWS&&!pathT.has(ty*COLS+tx)&&!blockT.has(ty*COLS+tx)&&!towerAt(tx,ty);

class Enemy{
  constructor(type,hm,sm,am){
    const t=ETYPE[type];
    this.type=type;this.t=t;
    this.maxHp=Math.round(t.hp*hm);this.hp=this.maxHp;
    this.baseSpeed=t.speed*rnd(.93,1.07)*(sm||1);
    this.armor=Math.round(t.armor*(am||1));this.flying=!!t.flying;this.boss=!!t.boss;
    this.chargeT=0;
    this.path=this.flying?AIR:WP;
    this.wi=1;this.x=this.path[0].x;this.y=this.path[0].y;
    this.trav=0;this.facing=1;this.head=0;this.walk=rnd(0,9);this.ph=rnd(0,TAU);
    this.slowT=0;this.slowF=1;this.burnT=0;this.burnDps=0;
    this.hitFlash=0;this.healCd=rnd(1,3);this.spawnT=0.35;this.dead=false;this.leaked=false;
    this.alt=this.flying?54:0;
  }
  get speed(){
    let f=this.slowF;
    if(this.t.charge) f*= 1+Math.min(.85,this.chargeT*0.055);
    return this.baseSpeed*f;
  }
  update(dt){
    this.spawnT=Math.max(0,this.spawnT-dt);
    this.walk+=this.speed*dt/13;
    this.hitFlash=Math.max(0,this.hitFlash-dt*3.4);
    if(this.slowT>0){this.slowT-=dt;if(this.slowT<=0)this.slowF=1;}
    if(this.t.charge) this.chargeT+=dt;
    if(this.t.regen && this.hp<this.maxHp && this.hp>0){
      this.hp=Math.min(this.maxHp,this.hp+this.maxHp*this.t.regen*dt);
      if(Math.random()<dt*4) addP({k:'spark',x:this.x+rnd(-10,10),y:this.y-this.alt-rnd(6,26),vx:rnd(-6,6),vy:rnd(-30,-10),life:.5,size:2,col:'#8ef0a8'});
    }
    if(this.burnT>0){
      this.burnT-=dt;this.hp-=this.burnDps*dt;
      if(Math.random()<dt*14) addP({k:'spark',x:this.x+rnd(-9,9),y:this.y-this.alt-rnd(4,26),vx:rnd(-8,8),vy:rnd(-40,-16),life:.5,size:2.4,col:'#ff9a3c'});
      if(this.hp<=0){this.die();return;}
    }
    if(this.t.heal){
      this.healCd-=dt;
      if(this.healCd<=0){this.healCd=3.2;
        addP({k:'ring',x:this.x,y:this.y-14,r0:6,r1:96,life:.65,col:'rgba(120,240,170,.65)'});
        enemies.forEach(o=>{if(o!==this&&!o.dead&&dist(o.x,o.y,this.x,this.y)<100){
          o.hp=Math.min(o.maxHp,o.hp+o.maxHp*0.11);
          addP({k:'text',txt:'+',x:o.x,y:o.y-30,life:.7,col:'#9df5c0',size:13});
        }});
      }
    }
    const tgt=this.path[this.wi];
    if(!tgt){this.leak();return;}
    const dx=tgt.x-this.x, dy=tgt.y-this.y, d=Math.hypot(dx,dy), step=this.speed*dt;
    if(Math.abs(dx)>1.2) this.facing=dx>0?1:-1;
    if(d>0.5){
      const want=Math.atan2(dy,Math.max(Math.abs(dx),0.001));
      this.head+=(want-this.head)*Math.min(1,dt*6.5);
    }
    if(d<=step){this.x=tgt.x;this.y=tgt.y;this.wi++;this.trav+=d;if(this.wi>=this.path.length)this.leak();}
    else{this.x+=dx/d*step;this.y+=dy/d*step;this.trav+=step;}
    if(this.flying) this.alt=54+Math.sin(this.walk*0.5+this.ph)*7;
  }
  hurt(v,pierce){
    const ar=Math.max(0,this.armor-(pierce||0));
    const d=Math.max(v*0.16, v-ar);
    this.hp-=d;this.hitFlash=1;
    if(d>=14) addP({k:'text',txt:Math.round(d),x:this.x+rnd(-8,8),y:this.y-this.alt-this.t.r-8,life:.62,col:'#fff0c8',size:12});
    if(this.hp<=0) this.die();
    return d;
  }
  vel(){
    const t=this.path[this.wi];
    if(!t)return{vx:0,vy:0};
    const dx=t.x-this.x,dy=t.y-this.y,d=Math.hypot(dx,dy)||1;
    return{vx:dx/d*this.speed, vy:dy/d*this.speed};
  }
  slow(f,dur){
    const res=this.t.slowRes||0; if(res>=1)return;
    const ef=1-(1-f)*(1-res);
    if(ef<this.slowF||this.slowT<=0){this.slowF=Math.min(this.slowF,ef);}
    this.slowT=Math.max(this.slowT,dur*(1-res*0.5));
  }
  burn(dps,dur){
    if(this.t.burnImm)return;
    this.burnDps=Math.max(this.burnDps,dps*(this.t.fireRes?1-this.t.fireRes:1));
    this.burnT=Math.max(this.burnT,dur);
  }
  die(){
    if(this.dead)return; this.dead=true;
    const g=Math.round(this.t.gold*(1+G.wave*0.010));
    G.gold+=g; G.score+=g*2; G.kills++;
    const p=this.t.pal, R=this.t.r, yy=this.y-this.alt;
    addP({k:'text',txt:'+'+g,x:this.x,y:yy-R-14,life:1.0,col:'#ffd07a',size:this.boss?18:13});
    // white flash burst
    addP({k:'flash',x:this.x,y:yy-R*0.5,r0:R*(this.boss?1.2:0.7),r1:R*(this.boss?4.2:2.5),
          life:this.boss?.4:.24,col:this.boss?'#ffdca0':'#fff4d8'});
    // fading silhouette "poof"
    addP({k:'ghost',fn:this.t.draw,e:{t:this.t,walk:this.walk},x:this.x,y:yy,face:this.facing,
          life:this.boss?.55:.34,col:'#fff'});
    // shock ring
    addP({k:'ring',x:this.x,y:yy,r0:R*0.5,r1:R*(this.boss?6:3.4),life:this.boss?.8:.46,
          col:this.boss?'rgba(255,180,90,.75)':'rgba(255,226,170,.6)'});
    // meaty chunks that tumble and land

   ============================================================ */
class Proj{
  constructor(o){Object.assign(this,o);this.dead=false;this.rot=0;}
  update(dt){
    if(this.arc){
      this.t+=dt/this.dur;
      const p=clamp(this.t,0,1);
      this.x=this.x0+(this.tx-this.x0)*p;
      this.y=this.y0+(this.ty-this.y0)*p - Math.sin(p*Math.PI)*this.h;
      this.rot+=dt*(this.kind==='rock'?7:10);
      if(this.kind==='fire'&&Math.random()<dt*40)
        addP({k:'smoke',x:this.x,y:this.y,vx:rnd(-12,12),vy:rnd(-20,0),life:.45,size:5,col:'rgba(255,140,50,.6)'});
      if(p>=1){this.dead=true;this.explode();}
      return;
    }
    if(this.kind==='bolt'){
      this.life-=dt;
      const s=this.speed*dt;
      this.x+=Math.cos(this.ang)*s;this.y+=Math.sin(this.ang)*s;
      for(const e of enemies){
        if(e.dead||this.hitSet.has(e))continue;
        const ey=e.y-(e.flying?e.alt:0);
        if(dist(this.x,this.y,e.x,ey)<e.t.r+10){
          this.hitSet.add(e); e.hurt(this.dmg,this.pierceArmor); this.src.kills++;
          addP({k:'ring',x:this.x,y:ey,r0:2,r1:26,life:.24,col:'rgba(255,240,190,.8)'});
          if(--this.left<=0){this.dead=true;break;}
        }
      }
      if(this.life<=0||this.x<-60||this.x>W+60||this.y<-60||this.y>H+60)this.dead=true;
      return;
    }
    // homing
    this.life-=dt;
    const tg=this.target;
    let tx,ty;
    if(tg&&!tg.dead){tx=tg.x;ty=tg.y-(tg.flying?tg.alt:0)-tg.t.r*0.6;this.lx=tx;this.ly=ty;}
    else{tx=this.lx!==undefined?this.lx:this.x+Math.cos(this.rot)*40;ty=this.ly!==undefined?this.ly:this.y;}
    const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy)||1;
    this.ang=Math.atan2(dy,dx);
    const s=this.speed*dt;
    if(this.kind==='ice'&&Math.random()<dt*30)
      addP({k:'spark',x:this.x,y:this.y,vx:rnd(-10,10),vy:rnd(-10,10),life:.35,size:2,col:'#a8e8ff'});
    if(d<=s+6){
      if(tg&&!tg.dead){
        tg.hurt(this.dmg,this.pierceArmor);this.src.kills++;
        if(this.slow)tg.slow(this.slow,this.slowDur);
        addP({k:'ring',x:tx,y:ty,r0:2,r1:this.kind==='ice'?22:16,life:.22,
          col:this.kind==='ice'?'rgba(150,230,255,.85)':'rgba(255,235,180,.8)'});
        for(let i=0;i<4;i++)addP({k:'spark',x:tx,y:ty,vx:rnd(-60,60),vy:rnd(-60,20),life:.3,size:2.2,
          col:this.kind==='ice'?'#bff0ff':'#ffe0a0'});
        sfx('hit');
      }
      this.dead=true;return;
    }
    this.x+=dx/d*s;this.y+=dy/d*s;
    if(this.life<=0)this.dead=true;
  }
  explode(){
    const R=this.splash||30;
    addP({k:'ring',x:this.x,y:this.y,r0:6,r1:R*1.5,life:.42,
      col:this.kind==='fire'?'rgba(255,150,50,.8)':'rgba(220,200,160,.8)'});
    for(let i=0;i<14;i++)addP({k:this.kind==='fire'?'spark':'dust',x:this.x,y:this.y,
      vx:rnd(-140,140),vy:rnd(-130,20),life:rnd(.3,.7),size:rnd(2,5.5),
      col:this.kind==='fire'?(Math.random()<.5?'#ff9b2f':'#ffd36e'):'#b09a76'});
    for(const e of enemies){
      if(e.dead||e.flying)continue;
      const d=dist(this.x,this.y,e.x,e.y);
      if(d<R){
        const f=1-d/R*0.5;
        e.hurt(this.dmg*f,0);this.src.kills++;
        if(this.burn)e.burn(this.burn,this.burnDur);
      }
    }
    if(this.kind==='rock'){shake(6,.22);sfx('boom');}else sfx('fireHit');
  }
  draw(c){
    c.save();c.translate(this.x,this.y);
    if(this.kind==='arrow'){
      c.rotate(this.ang);
      c.strokeStyle='#8a6a44';c.lineWidth=2.2;c.lineCap='round';
      c.beginPath();c.moveTo(-11,0);c.lineTo(6,0);c.stroke();
      c.fillStyle='#e6dcc4';c.beginPath();c.moveTo(6,-2.6);c.lineTo(13,0);c.lineTo(6,2.6);c.closePath();c.fill();
      c.fillStyle='#d9d0b8';c.beginPath();c.moveTo(-11,0);c.lineTo(-6,-3);c.lineTo(-6,3);c.closePath();c.fill();
    } else if(this.kind==='spear'){
      c.rotate(this.ang);
      c.strokeStyle='#7a5636';c.lineWidth=3.2;c.lineCap='round';
      c.beginPath();c.moveTo(-14,0);c.lineTo(8,0);c.stroke();
      c.fillStyle='#e0d6bd';c.beginPath();c.moveTo(8,-4);c.lineTo(18,0);c.lineTo(8,4);c.closePath();c.fill();
    } else if(this.kind==='bolt'){
      c.rotate(this.ang);
      c.fillStyle='rgba(255,230,160,.3)';roundRect(c,-30,-3.4,44,6.8,3);c.fill();
      c.strokeStyle='#6b4a2c';c.lineWidth=4;c.lineCap='round';
      c.beginPath();c.moveTo(-16,0);c.lineTo(12,0);c.stroke();
      c.fillStyle='#f0e8cc';c.beginPath();c.moveTo(12,-5.4);c.lineTo(26,0);c.lineTo(12,5.4);c.closePath();c.fill();
    } else if(this.kind==='ice'){
      c.rotate(this.rot+=0.2);
      c.fillStyle='rgba(120,215,255,.35)';circ(c,0,0,9);
      c.fillStyle='#c8f0ff';c.beginPath();c.moveTo(0,-8);c.lineTo(5,0);c.lineTo(0,8);c.lineTo(-5,0);c.closePath();c.fill();
      c.fillStyle='#ffffff';circ(c,-1.4,-1.4,2);
    } else if(this.kind==='rock'){
      c.rotate(this.rot);
      c.fillStyle='#6d6558';c.beginPath();
      c.moveTo(-9,-2);c.lineTo(-4,-9);c.lineTo(6,-8);c.lineTo(9,1);c.lineTo(2,9);c.lineTo(-7,6);c.closePath();c.fill();
      c.fillStyle='#8c8375';c.beginPath();c.moveTo(-4,-9);c.lineTo(6,-8);c.lineTo(3,-2);c.lineTo(-5,-3);c.closePath();c.fill();
    } else if(this.kind==='fire'){
      const s=1+Math.sin(this.t*24)*0.15;
      c.scale(s,s);
      c.fillStyle='rgba(255,120,30,.3)';circ(c,0,0,12);
      c.fillStyle='#ff8a2a';circ(c,0,0,7);
      c.fillStyle='#ffd166';circ(c,-1,-1.6,4);
      c.fillStyle='#fff3c4';circ(c,-1.6,-2.4,1.8);
    }
    c.restore();
  }
}

const parts=[];
function addP(o){ if(parts.length>760)return; o.age=0;o.maxLife=o.life;parts.push(o); }
function updP(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.age+=dt;
    if(p.age>=p.life){parts.splice(i,1);continue;}
    if(p.k==='dust'||p.k==='spark'||p.k==='smoke'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.k==='dust')p.vy+=280*dt; else if(p.k==='spark')p.vy+=90*dt; else p.vy-=30*dt;
      p.vx*=(1-1.4*dt);
    } else if(p.k==='text'){ p.y-=34*dt; }
    else if(p.k==='gib'){
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=560*dt; p.rot+=p.spin*dt;
      if(p.y>p.gy){ p.y=p.gy; p.vy*=-0.38; p.vx*=0.62; p.spin*=0.55; if(Math.abs(p.vy)<26)p.vy=0; }
    }
  }
}
function drawP(c){
  for(const p of parts){
    const t=p.age/p.life, a=1-t;
    if(p.k==='ring'){
      const r=p.r0+(p.r1-p.r0)*t;
      c.strokeStyle=p.col.replace(/[\d.]+\)$/,(a*0.9).toFixed(2)+')');
      c.lineWidth=2.6*a+0.6;c.beginPath();c.arc(p.x,p.y,r,0,TAU);c.stroke();
    } else if(p.k==='flash'){
      const r=p.r0+(p.r1-p.r0)*t;
      c.globalAlpha=a*a; c.fillStyle=p.col; circ(c,p.x,p.y,r); c.globalAlpha=1;
    } else if(p.k==='ghost'){
      c.save(); c.globalAlpha=a*0.85; c.translate(p.x,p.y);
      const sc=1+t*0.55; c.scale(p.face*sc,sc);
      try{c.filter='brightness(2.6) saturate(.25)';}catch(err){}
      try{ p.fn(c,p.e); }catch(err){}
      try{c.filter='none';}catch(err){}
      c.restore(); c.globalAlpha=1;
    } else if(p.k==='gib'){
      c.save(); c.globalAlpha=Math.min(1,a*2.2); c.translate(p.x,p.y); c.rotate(p.rot);
      c.fillStyle=p.col; const q=p.size;
      c.beginPath(); c.moveTo(-q,-q*0.6); c.lineTo(q*0.9,-q); c.lineTo(q,q*0.7); c.lineTo(-q*0.7,q); c.closePath();
      c.fill(); c.strokeStyle='rgba(24,16,10,.45)'; c.lineWidth=1.2; c.stroke();
      c.restore(); c.globalAlpha=1;
    } else if(p.k==='text'){
      c.globalAlpha=a;c.fillStyle=p.col;c.font='bold '+(p.size||12)+'px "Trebuchet MS",sans-serif';
      c.textAlign='center';c.strokeStyle='rgba(0,0,0,.7)';c.lineWidth=3;
      c.strokeText(p.txt,p.x,p.y);c.fillText(p.txt,p.x,p.y);c.globalAlpha=1;c.textAlign='left';
    } else {
      c.globalAlpha=p.k==='smoke'?a*0.55:a;
      c.fillStyle=p.col;
      circ(c,p.x,p.y,p.size*(p.k==='smoke'?(1+t*1.4):a*0.7+0.35));
      c.globalAlpha=1;
    }
  }
}

const enemies=[], towers=[], projs=[];
const G={lives:25,maxLives:30,gold:420,wave:0,score:0,kills:0,state:'intro',speed:1,active:false,queue:[],qt:0,leaked:0,repairs:0};
let sel=null, ghost=null, hoverTile=null, shakeT=0, shakeM=0, timeNow=0;
function towerAt(tx,ty){return towers.find(t=>t.tx===tx&&t.ty===ty);}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t);}

const HANDW=[
 [['raptor',8,1.05]],
 [['raptor',13,.85]],
 [['raptor',10,.7],['wolf',5,1.2]],
 [['wolf',9,.8],['tiger',5,1.5]],
 [['ptero',8,.95],['raptor',8,.7]],
 [['tiger',11,.75],['scorp',5,1.5]],
 [['terror',9,.85],['wolf',8,.7]],
 [['raptor',24,.4],['wolf',10,.55]],
 [['scorp',10,.8],['ptero',8,.65],['tiger',6,.9]],
 [['trex',1,1],['raptor',14,.45],['wolf',8,.6]],
 [['bat',12,.5],['terror',10,.7]],
 [['spider',11,.65],['tiger',10,.6]],
 [['beetle',7,1.1],['scorp',10,.65]],
 [['shaman',3,2],['spider',12,.55],['bat',9,.5]],
 [['golem',1,1],['beetle',6,1.1],['terror',10,.6]]
];
/* every wave from 16 on is generated: bigger packs, tighter spacing,
   a boss cycle every 5 waves, and new species folded in as they unlock */
const UNLOCK=[['raptor',1],['wolf',3],['tiger',4],['ptero',5],['scorp',6],['terror',7],
  ['bat',11],['spider',12],['beetle',13],['shaman',14],['serp',16],['mammo',18],
  ['rhino',20],['sloth',24],['wasp',26]];
const BOSSCYCLE=['trex','golem','wyrm'];
const MAXW=100;
const WCACHE={};
function genWave(n){
  if(WCACHE[n])return WCACHE[n];
  const R=mulberry(7771+n*9173);
  const rr=(x,y)=>x+R()*(y-x);
  const pool=UNLOCK.filter(u=>n>=u[1]);
  const picks=Math.min(4,2+Math.floor(n/26));
  const out=[],used={};
  for(let i=0;i<picks+2 && out.length<picks;i++){
    const u=pool[Math.floor(R()*pool.length)];
    if(!u||used[u[0]])continue; used[u[0]]=1;
    const t=ETYPE[u[0]];
    let cnt=Math.round((6+n*0.28)*Math.sqrt(60/t.hp)*rr(.85,1.15));
    cnt=clamp(cnt,2,30);
    const gap=clamp(1.9/Math.pow(cnt,.45)*(t.hp>380?2.2:1)*rr(.85,1.15),.2,3.0);
    out.push([u[0],cnt,+gap.toFixed(2)]);
  }
  if(n%5===0){
    const b=BOSSCYCLE[Math.floor(n/5)%3];
    out.unshift([b, n>=90?3:(n>=60?2:1), 3.5]);
  }
  if(n===MAXW){ out.unshift(['wyrm',2,4]); out.unshift(['golem',2,4]); }
  WCACHE[n]=out; return out;
}
function waveList(n){
  if(n<=HANDW.length) return HANDW[n-1];
  if(n<=MAXW) return genWave(n);
  const b=genWave(MAXW-((n-MAXW)%4));
  return b.map(g=>[g[0],Math.round(g[1]*1.2),Math.max(.18,g[2]*.88)]);
}
function hpMul(n){
  return (1+0.115*(n-1)) * Math.pow(1.011, Math.max(0,n-20)) * (n>MAXW?Math.pow(1.13,n-MAXW):1);
}
function spdMul(n){ return 1+Math.min(.45,0.0048*(n-1)); }
function armMul(n){ return 1+Math.min(.72,0.012*(n-1)); }

function startWave(){
  if(G.state!=='play')return;
  if(G.active){ G.gold+=25; toast(L('earlyBonus')); }
  G.wave++;
  const list=waveList(G.wave), hm=hpMul(G.wave), sm=spdMul(G.wave), am=armMul(G.wave);
  list.forEach(g=>{ let tt=0; for(let i=0;i<g[1];i++){ G.queue.push({type:g[0],t:tt,hm:hm,sm:sm,am:am}); tt+=g[2]; } });
  G.queue.sort((a,b)=>a.t-b.t);
  G.qt=0;G.active=true;
  toast(L('waveWord')+' '+G.wave+' — '+list.map(g=>g[1]+'× '+nm(ETYPE[g[0]])).join(', '));
  sfx('wave');
  refreshUI();
}

/* ============================================================
   LOOP
   ============================================================ */
let last=performance.now(), uiT=0;
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,.05);
  if(G.state==='play'){ for(let i=0;i<G.speed;i++) step(dt); }
  else { updP(dt*.6); }
  timeNow+=dt;
  uiT+=dt; if(uiT>.12){uiT=0;refreshUI();}
  render();
}
function step(dt){
  timeNow+=0;
  if(shakeT>0){shakeT-=dt;if(shakeT<=0)shakeM=0;}
  // spawn
  if(G.active){
    G.qt+=dt;
    while(G.queue.length && G.queue[0].t<=G.qt){
      const s=G.queue.shift();
      enemies.push(new Enemy(s.type,s.hm,s.sm,s.am));
    }
  }
  for(const e of enemies) if(!e.dead) e.update(dt);
  for(const t of towers) t.update(dt);
  for(const p of projs) if(!p.dead) p.update(dt);
  updP(dt);
  for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead) enemies.splice(i,1);
  for(let i=projs.length-1;i>=0;i--) if(projs[i].dead) projs.splice(i,1);

  if(G.lives<=0){ G.lives=0; endGame(false); return; }
  if(G.active && !G.queue.length && !enemies.length){
    G.active=false;
    const bonus=Math.round(28+G.wave*5.5);
    G.gold+=bonus;G.score+=200+G.wave*35;
    if(G.wave%20===0) G.maxLives=Math.min(46,G.maxLives+3);
    if(G.wave%10===0 && G.lives<G.maxLives){ G.lives=Math.min(G.maxLives,G.lives+2); }
    toast(L('clearedA')+G.wave+L('clearedB')+bonus+L('clearedC'));
    sfx('clear');
    if(G.wave>=MAXW){ endGame(true); return; }
  }
}

/* ---------- render ---------- */
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shakeM>0) ctx.translate(rnd(-shakeM,shakeM),rnd(-shakeM,shakeM));
  ctx.drawImage(bg,0,0,W,H);
  // animated ambience
  ambience();
  // build ghost / range preview
  if(ghost&&hoverTile){
    const ok=isFree(hoverTile.x,hoverTile.y) && G.gold>=ghost.cost;
    const cx=T(hoverTile.x),cy=T(hoverTile.y);
    ctx.fillStyle=ok?'rgba(126,224,120,.16)':'rgba(230,70,50,.2)';
    ctx.strokeStyle=ok?'rgba(150,255,140,.85)':'rgba(255,110,90,.9)';
    ctx.lineWidth=2;
    roundRect(ctx,cx-30,cy-30,60,60,8);ctx.fill();ctx.stroke();
    ctx.fillStyle=ok?'rgba(120,220,255,.09)':'rgba(255,90,70,.07)';
    ctx.strokeStyle=ok?'rgba(150,230,255,.5)':'rgba(255,120,90,.4)';
    ctx.beginPath();ctx.arc(cx,cy,ghost.range,0,TAU);ctx.fill();ctx.stroke();
    ctx.save();ctx.globalAlpha=.72;ctx.translate(cx,cy);
    ghost.draw(ctx,{ang:-Math.PI/2,recoil:0,idle:timeNow,level:1,cd:0,rate:1});
    ctx.restore();
  }
  if(sel){
    ctx.fillStyle='rgba(120,220,255,.07)';ctx.strokeStyle='rgba(160,235,255,.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sel.x,sel.y,sel.range,0,TAU);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,208,122,.9)';ctx.lineWidth=2;
    roundRect(ctx,sel.x-30,sel.y-30,60,60,8);ctx.stroke();
  }
  // depth-sorted actors
  const acts=[];
  for(const t of towers)acts.push(t);
  for(const e of enemies)acts.push(e);
  acts.sort((a,b)=>a.y-b.y);
  for(const a of acts) a.draw(ctx);
  for(const p of projs) p.draw(ctx);
  drawP(ctx);
  bossBar();
  if(G.state==='play'&&!G.active&&!enemies.length) callHint();
  ctx.restore();
}
function ambience(){
  // pond shimmer
  ctx.save();
  ctx.globalAlpha=.28;ctx.strokeStyle='#bff0ea';ctx.lineWidth=1.6;
  for(let i=0;i<4;i++){
    const y=552+i*9, w2=48-i*8;
    ctx.beginPath();
    for(let x=-w2;x<=w2;x+=8) ctx.lineTo(72+x, y+Math.sin(x*0.09+timeNow*1.6+i)*1.7);
    ctx.stroke();
  }
  ctx.restore();
  // volcano smoke
  if(Math.random()<.28) addP({k:'smoke',x:956+rnd(-10,10),y:20,vx:rnd(-14,10),vy:rnd(-26,-12),life:rnd(1.6,2.8),size:rnd(6,13),col:'rgba(150,140,132,.5)'});
  if(Math.random()<.06) addP({k:'spark',x:956+rnd(-7,7),y:20,vx:rnd(-24,24),vy:rnd(-56,-24),life:1.1,size:2.4,col:'#ff9b2f'});
  // fireflies
  ctx.fillStyle='rgba(255,238,150,.5)';
  for(let i=0;i<11;i++){
    const a=timeNow*0.35+i*2.1;
    const x=(i*97+Math.sin(a)*60+120)%W, y=(i*61+Math.cos(a*1.3)*40+90)%H;
    ctx.globalAlpha=.28+0.3*Math.sin(timeNow*3+i);
    circ(ctx,x,y,1.9);
  }
  ctx.globalAlpha=1;
  // entrance / exit markers
  ctx.save();
  const pulse=0.5+Math.sin(timeNow*3)*0.5;
  ctx.strokeStyle='rgba(226,90,42,'+(0.35+pulse*0.4)+')';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(6,T(4),20+pulse*5,-1.1,1.1);ctx.stroke();
  ctx.fillStyle='rgba(226,90,42,.75)';ctx.font='bold 11px "Trebuchet MS",sans-serif';
  ctx.fillText(L('markIn'),12,T(4)-26);
  ctx.strokeStyle='rgba(110,220,140,'+(0.35+pulse*0.4)+')';
  ctx.beginPath();ctx.arc(W-6,T(8),20+pulse*5,Math.PI-1.1,Math.PI+1.1);ctx.stroke();
  ctx.fillStyle='rgba(110,220,140,.8)';ctx.fillText(L('markBase'),W-66,T(8)-26);
  ctx.restore();
}
function bossBar(){
  const b=enemies.find(e=>e.boss&&!e.dead);
  if(!b)return;
  const bw=380,x=(W-bw)/2,y=16;
  ctx.fillStyle='rgba(10,7,5,.78)';roundRect(ctx,x-6,y-6,bw+12,32,8);ctx.fill();
  ctx.strokeStyle='rgba(224,90,43,.8)';ctx.lineWidth=1.4;ctx.stroke();
  const p=clamp(b.hp/b.maxHp,0,1);
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(ctx,x,y+10,bw,12,6);ctx.fill();
  const g=ctx.createLinearGradient(x,0,x+bw,0);g.addColorStop(0,'#e04a2a');g.addColorStop(1,'#ffb03c');
  ctx.fillStyle=g;roundRect(ctx,x,y+10,bw*p,12,6);ctx.fill();
  ctx.fillStyle='#f4e4c4';ctx.font='bold 12px "Trebuchet MS",sans-serif';ctx.textAlign='center';
  ctx.fillText(b.t.name.toUpperCase()+'  ·  '+Math.ceil(b.hp)+' / '+b.maxHp,W/2,y+7);
  ctx.textAlign='left';
}
function callHint(){
  const pulse=0.55+Math.sin(timeNow*3)*0.45;
  ctx.fillStyle='rgba(10,7,5,'+(0.5+pulse*0.2)+')';
  roundRect(ctx,W/2-136,H-52,272,34,10);ctx.fill();
  ctx.strokeStyle='rgba(242,168,60,'+(0.4+pulse*0.5)+')';ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle='#ffd07a';ctx.font='bold 14px "Trebuchet MS",sans-serif';ctx.textAlign='center';
  ctx.fillText(L('ready'),W/2,H-30);
  ctx.textAlign='left';
}

/* ============================================================
   AUDIO
   ============================================================ */
const AC=window.AudioContext||window.webkitAudioContext;
let actx=null,sndOn=true,lastS=0;
function initAudio(){ if(!actx&&AC){ try{actx=new AC();}catch(e){} } if(actx&&actx.state==='suspended')actx.resume(); }
function tone(f,dur,type,vol,slide){
  if(!sndOn||!actx)return;
  const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(24,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
}
function nois(dur,vol,f){
  if(!sndOn||!actx)return;
  const t=actx.currentTime,len=Math.floor(actx.sampleRate*dur);
  const b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=actx.createBufferSource();s.buffer=b;
  const bp=actx.createBiquadFilter();bp.type='lowpass';bp.frequency.value=f||900;
  const g=actx.createGain();g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(actx.destination);s.start(t);
}
function sfx(k){
  if(!sndOn||!actx)return;
  const n=performance.now();
  if(k==='arrow'||k==='spear'||k==='ice'||k==='bolt'||k==='hit'){ if(n-lastS<52)return; lastS=n; }
  switch(k){
    case 'arrow': tone(760,.06,'square',.028,420);break;
    case 'spear': tone(430,.09,'sawtooth',.03,220);break;
    case 'bolt':  tone(240,.16,'sawtooth',.045,90);break;
    case 'ice':   tone(1180,.1,'triangle',.03,1600);break;
    case 'rock':  nois(.1,.05,500);break;
    case 'fire':  nois(.12,.05,1500);break;
    case 'hit':   tone(190,.05,'square',.022,110);break;
    case 'fireHit': nois(.18,.06,1100);break;
    case 'boom':  nois(.42,.13,420);tone(90,.35,'sine',.07,40);break;
    case 'die':   tone(300,.09,'triangle',.03,140);break;
    case 'build': tone(300,.07,'square',.05,560);setTimeout(()=>tone(560,.09,'square',.045,760),70);break;
    case 'up':    tone(520,.07,'triangle',.05,700);setTimeout(()=>tone(780,.11,'triangle',.05,1040),70);break;
    case 'sell':  tone(420,.1,'triangle',.04,180);break;
    case 'leak':  tone(160,.28,'sawtooth',.07,60);break;
    case 'wave':  tone(120,.5,'sawtooth',.06,70);break;
    case 'clear': [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.14,'triangle',.05),i*85));break;
    case 'nope':  tone(150,.12,'square',.04,90);break;
  }
}

/* ============================================================
   UI
   ============================================================ */
const $=id=>document.getElementById(id);
const shopEl=$('shop'), infoEl=$('info'), toastEl=$('toast'), veil=$('veil'), modal=$('modal');
let toastT=0;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2100); }

function buildShop(){
  shopEl.innerHTML='';
  TDEF.forEach(d=>{
    const b=document.createElement('button');
    b.className='card';b.dataset.id=d.id;
    b.innerHTML='<canvas width="76" height="76"></canvas><div><div class="n">'+nm(d)+'</div><div class="c">🪙 '+d.cost+'</div></div>';
    b.title=ds(d);
    const ic=b.querySelector('canvas').getContext('2d');
    ic.setTransform(2,0,0,2,0,0);ic.translate(19,26);ic.scale(.62,.62);
    d.draw(ic,{ang:-Math.PI/2-0.35,recoil:0,idle:1.2,level:1,cd:0,rate:1});
    b.addEventListener('click',()=>{
      initAudio();
      if(G.gold<d.cost){sfx('nope');toast(L('noGoldFor')+nm(d));return;}
      ghost = ghost&&ghost.id===d.id ? null : d;
      sel=null;syncCards();refreshUI();
    });
    shopEl.appendChild(b);
  });
}
buildShop();
function syncCards(){
  [...shopEl.children].forEach(b=>{
    const d=TMAP[b.dataset.id];
    b.classList.toggle('sel',!!ghost&&ghost.id===d.id);
    b.classList.toggle('poor',G.gold<d.cost);
  });
  $('shoptip').textContent = ghost? L('shopPick') : L('shopIdle');
}
function showInfo(){
  if(!sel){infoEl.classList.remove('on');return;}
  infoEl.classList.add('on');
  $('i-lv').textContent=L('lvl')+' '+sel.level+'/'+MAXLV;
  const d=sel.def;
  $('i-body').innerHTML=
    '<div class="rowline"><span>'+nm(d)+'</span><b>'+tg(d)+'</b></div>'+
    '<div class="rowline"><span>'+L('dmg')+'</span><b>'+Math.round(sel.dmg)+'</b></div>'+
    '<div class="rowline"><span>'+L('rof')+'</span><b>'+(1/sel.rate).toFixed(2)+L('perSec')+'</b></div>'+
    '<div class="rowline"><span>'+L('range')+'</span><b>'+Math.round(sel.range)+'</b></div>'+
    '<div class="rowline"><span>'+L('targets')+'</span><b>'+(d.air?L('tBoth'):L('tGround'))+'</b></div>'+
    '<div class="rowline"><span>'+L('kills')+'</span><b>'+sel.kills+'</b></div>';
  const up=$('b-up');
  if(sel.level>=MAXLV){ up.disabled=true; up.textContent=L('maxed'); }
  else { up.disabled=G.gold<sel.upCost; up.textContent=L('upgrade')+' · 🪙'+sel.upCost; }
  $('b-sell').textContent=L('sell')+' · 🪙'+sel.sellVal;
  document.querySelectorAll('.chip[data-mode]').forEach(c=>c.classList.toggle('on',c.dataset.mode===sel.mode));
}
function refreshUI(){
  $('s-hp').textContent=G.lives+'/'+G.maxLives;
  $('s-gold').textContent=G.gold;
  $('s-wave').textContent=Math.min(G.wave,999)+'/'+MAXW;
  $('s-score').textContent=G.score;
  const nx=waveList(G.wave+1);
  $('nextwave').innerHTML='<b>'+L('waveWord')+' '+(G.wave+1)+'</b> · '+
    nx.map(g=>g[1]+'× '+nm(ETYPE[g[0]])+(ETYPE[g[0]].flying?' 🕊':'')+(ETYPE[g[0]].boss?' 💀':'')).join('<br>');
  $('b-wave').textContent = G.active? L('early') : L('release');
  $('b-repair').textContent = L('repair')+' +1 ♥ · 🪙'+repairCost();
  $('b-repair').disabled = G.lives>=G.maxLives;
  syncCards();showInfo();
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=L(el.dataset.i18n); });
  document.title = L('title')+' — '+L('sub');
  $('tipsbody').innerHTML=L('tipsBody');
  $('b-speed').textContent=L('speed')+' '+G.speed+'x';
  $('b-pause').textContent=(G.state==='pause')?L('resume'):L('pause');
  $('b-sound').textContent=L('sound')+': '+(sndOn?L('on'):L('off'));
  $('lang-vi').classList.toggle('on',LANG==='vi');
  $('lang-en').classList.toggle('on',LANG==='en');
  buildShop();
  refreshUI();
}
$('lang-vi').addEventListener('click',()=>{LANG='vi';applyLang();});
$('lang-en').addEventListener('click',()=>{LANG='en';applyLang();});
$('b-wave').addEventListener('click',()=>{initAudio();startWave();});
$('b-up').addEventListener('click',()=>{
  if(!sel||sel.level>=MAXLV)return;
  const c=sel.upCost;
  if(G.gold<c){sfx('nope');toast(L('noGold'));return;}
  G.gold-=c;sel.invested+=c;sel.level++;sel.built=.3;sel.flash=1;sfx('up');
  addP({k:'flash',x:sel.x,y:sel.y-12,r0:4,r1:46,life:.3,col:'#fff0c8'});
  addP({k:'ring',x:sel.x,y:sel.y,r0:8,r1:60,life:.5,col:'rgba(255,210,120,.85)'});
  addP({k:'ring',x:sel.x,y:sel.y,r0:2,r1:34,life:.36,col:'rgba(255,245,200,.9)'});
  for(let i=0;i<16;i++)addP({k:'spark',x:sel.x,y:sel.y-8,vx:rnd(-90,90),vy:rnd(-140,-25),life:.7,size:2.8,col:'#ffd889'});
  shake(2.2,.1);
  refreshUI();
});
$('b-sell').addEventListener('click',()=>{
  if(!sel)return;
  G.gold+=sel.sellVal;sfx('sell');
  for(let i=0;i<10;i++)addP({k:'dust',x:sel.x,y:sel.y,vx:rnd(-60,60),vy:rnd(-70,10),life:.5,size:3.4,col:'#a8926e'});
  towers.splice(towers.indexOf(sel),1);sel=null;refreshUI();
});
document.querySelectorAll('.chip[data-mode]').forEach(c=>c.addEventListener('click',()=>{
  if(!sel)return; sel.mode=c.dataset.mode; showInfo();
}));
$('b-speed').addEventListener('click',()=>{
  G.speed=G.speed===1?2:(G.speed===2?3:1);
  $('b-speed').textContent=L('speed')+' '+G.speed+'x';
  $('b-speed').classList.toggle('on',G.speed>1);
});
$('b-pause').addEventListener('click',()=>{
  if(G.state==='play'){G.state='pause';$('b-pause').textContent=L('resume');$('b-pause').classList.add('on');
    openModal('<h3>'+L('pauseT')+'</h3><p class="sub">'+L('pauseS')+'</p><button>'+L('resumeBtn')+'</button>',()=>{
      G.state='play';$('b-pause').textContent=L('pause');$('b-pause').classList.remove('on');closeModal();});
  } else if(G.state==='pause'){
    G.state='play';$('b-pause').textContent=L('pause');$('b-pause').classList.remove('on');closeModal();
  }
});
$('b-sound').addEventListener('click',()=>{
  sndOn=!sndOn;initAudio();
  $('b-sound').textContent=L('sound')+': '+(sndOn?L('on'):L('off'));
  $('b-sound').classList.toggle('on',sndOn);
});
$('b-sound').classList.add('on');
function repairCost(){ return Math.round(180+G.repairs*70+G.wave*6); }
$('b-repair').addEventListener('click',()=>{
  initAudio();
  if(G.lives>=G.maxLives){sfx('nope');toast(L('repairFull'));return;}
  const c=repairCost();
  if(G.gold<c){sfx('nope');toast(L('noGold'));return;}
  G.gold-=c;G.lives++;G.repairs++;sfx('up');
  toast(L('repairOk'));
  refreshUI();
});

/* ---------- pointer ---------- */
function toBoard(ev){
  const r=cv.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('pointermove',e=>{
  const p=toBoard(e);
  hoverTile={x:Math.floor(p.x/TILE),y:Math.floor(p.y/TILE)};
});
cv.addEventListener('pointerleave',()=>{hoverTile=null;});
cv.addEventListener('pointerdown',e=>{
  initAudio();
  const p=toBoard(e);
  const tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
  hoverTile={x:tx,y:ty};
  if(G.state!=='play'&&G.state!=='intro')return;
  if(ghost){
    if(!isFree(tx,ty)){sfx('nope');toast(L('noSpot'));return;}
    if(G.gold<ghost.cost){sfx('nope');toast(L('noGold'));return;}
    G.gold-=ghost.cost;
    const t=new Tower(ghost,tx,ty);towers.push(t);
    addP({k:'ring',x:t.x,y:t.y,r0:6,r1:52,life:.4,col:'rgba(255,220,150,.8)'});
    for(let i=0;i<10;i++)addP({k:'dust',x:t.x,y:t.y+6,vx:rnd(-70,70),vy:rnd(-60,-8),life:.5,size:3.6,col:'#b6a181'});
    sfx('build');shake(3,.12);
    if(!e.shiftKey && G.gold<ghost.cost) ghost=null;
    sel=t;refreshUI();return;
  }
  const t=towerAt(tx,ty);
  sel=(t&&t!==sel)?t:null;
  refreshUI();
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ghost=null;sel=null;refreshUI();}
  if(e.key===' '){e.preventDefault();$('b-pause').click();}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=6){ const d=TDEF[n-1]; if(G.gold>=d.cost){ghost=d;sel=null;refreshUI();} }
});

/* ---------- modals ---------- */
function openModal(html,onBtn){
  modal.innerHTML=html;veil.classList.remove('off');
  const b=modal.querySelector('button');
  if(b) b.addEventListener('click',()=>{initAudio();onBtn&&onBtn();});
}
function closeModal(){veil.classList.add('off');}
function endGame(win){
  G.state='over';
  G.score+=Math.round(G.gold*0.25);
  const stats='<div class="tally">'+
    '<div><b>'+G.wave+'</b><span>'+L('tWave')+'</span></div>'+
    '<div><b>'+G.kills+'</b><span>'+L('tKills')+'</span></div>'+
    '<div><b>'+G.score+'</b><span>'+L('tScore')+'</span></div>'+
    '<div><b>'+G.lives+'</b><span>'+L('tLives')+'</span></div></div>';
  if(win) openModal('<h3>'+L('winT')+'</h3><p class="sub">'+L('winS')+'</p>'+stats+
    '<p>'+L('winB')+'</p><button>'+L('againBtn')+'</button>',reset);
  else openModal('<h3>'+L('loseT')+'</h3><p class="sub">'+L('loseS')+G.wave+'</p>'+stats+
    '<p>'+L('loseB')+'</p><button>'+L('retryBtn')+'</button>',reset);
}
function reset(){
  enemies.length=0;towers.length=0;projs.length=0;parts.length=0;
  Object.assign(G,{lives:25,maxLives:30,gold:420,wave:0,score:0,kills:0,state:'play',speed:1,active:false,queue:[],qt:0,repairs:0});
  sel=null;ghost=null;$('b-speed').textContent=L('speed')+' 1x';$('b-speed').classList.remove('on');
  $('b-pause').textContent=L('pause');$('b-pause').classList.remove('on');
  closeModal();refreshUI();
}
function intro(){
  openModal('<h3>'+L('introT')+'</h3><p class="sub">'+L('introS')+'</p><p>'+L('introB')+'</p>'+
    '<button>'+L('startBtn')+'</button>',
    ()=>{G.state='play';closeModal();refreshUI();});
}
applyLang();
intro();
refreshUI();
requestAnimationFrame(loop);
})();
</script>
