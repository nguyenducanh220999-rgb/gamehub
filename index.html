<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GamHub Arcade - Cổng Game Web HTML5 Trực Tuyến</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-mono-tech { font-family: 'Share Tech Mono', monospace; }
        .neon-glow-blue { box-shadow: 0 0 15px rgba(59,130,246,0.4); border-color: rgba(59,130,246,0.6); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

    <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-40 px-4 md:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-gamepad text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-black font-orbitron tracking-widest text-white">GAM<span class="text-blue-500">HUB</span></h1>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 flex flex-col gap-8">
        <div class="space-y-4">
            <h3 class="text-lg font-bold font-orbitron tracking-wide text-slate-300">💬 BẢNG TIN CỘNG ĐỒNG</h3>
            <div class="bg-gradient-to-br from-slate-900/80 to-slate-950/80 rounded-2xl border border-slate-800/80 p-5 md:p-6 space-y-5">
                <textarea id="commentInput" placeholder="Viết gì đó... góp ý game, yêu cầu game mới 👋" maxlength="200" rows="3" class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-slate-200 outline-none transition"></textarea>
                <div class="flex items-center justify-between">
                    <span id="charCount" class="text-xs text-slate-500 font-mono">0 / 200</span>
                    <button id="sendComment" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-lg text-sm transition active:scale-95">Gửi ẩn danh</button>
                </div>
                <div id="commentsList" class="space-y-3 pt-4 border-t border-slate-800"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALMfE9AfEaRGSgSp6IghU5Cu9uIs54-ac",
            authDomain: "gamhub-f3381.firebaseapp.com",
            projectId: "gamhub-f3381",
            storageBucket: "gamhub-f3381.firebasestorage.app",
            messagingSenderId: "567076365200",
            appId: "1:567076365200:web:5f3bc16acb90d8e27d8915"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const input = document.getElementById('commentInput');
        const sendBtn = document.getElementById('sendComment');
        const charCount = document.getElementById('charCount');
        const commentsList = document.getElementById('commentsList');

        let lastSentTime = 0;

        input.addEventListener('input', () => {
            charCount.textContent = input.value.length + ' / 200';
        });

        sendBtn.addEventListener('click', async () => {
            const currentTime = Date.now();
            if (currentTime - lastSentTime < 30000) {
                alert("Đợi 30 giây mới được gửi tiếp nhé! 🛡️");
                return;
            }

            const text = input.value.trim();
            if (!text) return;

            sendBtn.disabled = true;
            sendBtn.textContent = 'Đang gửi...';
            try {
                await addDoc(collection(db, "comments"), { text: text, time: serverTimestamp() });
                lastSentTime = Date.now();
                input.value = '';
                charCount.textContent = '0 / 200';
            } catch(e) {
                alert('Lỗi!');
            }
            sendBtn.disabled = false;
            sendBtn.textContent = 'Gửi ẩn danh';
        });

        const q = query(collection(db, "comments"), orderBy("time", "desc"), limit(5));
        onSnapshot(q, (snapshot) => {
            commentsList.innerHTML = snapshot.docs.map(doc => {
                const d = doc.data();
                return `<div class="bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-3">
                    <p class="text-sm text-slate-200">${d.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>
                </div>`;
            }).join('');
        });
    </script>
</body>
</html>
